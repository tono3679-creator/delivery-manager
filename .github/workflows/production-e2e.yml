name: 公開環境の E2E テスト

# 公開したサイトに対して、ブラウザでの E2E テスト（PC・スマートフォン）を実行する。
# Actions タブ → このワークフロー → Run workflow で、公開した URL を入力して実行する。
# テストごとに「体験」から専用のデモ会社を作り、終わったら削除する（削除に Secrets の SUPABASE_DB_URL を使う）。

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 公開した URL（例：https://delivery-manager.vercel.app）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 入力した URL の確認
        env:
          INPUT_URL: ${{ inputs.base_url }}
        run: |
          if [[ ! "$INPUT_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "::error::https:// で始まるサイトの URL（パスなし）を入力してください"
            exit 1
          fi
          echo "E2E_BASE_URL=${INPUT_URL%/}" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: ブラウザでの E2E テスト（PC・スマートフォン）
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: E2E の結果（スクリーンショット・トレース）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
