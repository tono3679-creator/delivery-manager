name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      LOCAL_DB: dm
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dm
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dm
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: マイグレーション適用・デモデータ投入・整合性チェック
        run: |
          npm run db:local:reset
          npm run db:seed
          npm run db:verify
      - run: npm test
      - run: npm run build
